<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">AutoNex AI social preview</title>
  <desc id="description">A dark, lime-accented AutoNex AI banner showing a vehicle comparison and AI summary.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="1" stop-color="#111b24"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#183344" stop-opacity=".8"/>
      <stop offset="1" stop-color="#183344" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carPaint" x2="0" y2="1">
      <stop offset="0" stop-color="#a3f56c"/>
      <stop offset="1" stop-color="#5db93f"/>
    </linearGradient>
    <linearGradient id="bluePaint" x2="0" y2="1">
      <stop offset="0" stop-color="#70c9ff"/>
      <stop offset="1" stop-color="#3788c4"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8ba4b5" opacity=".11"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <ellipse cx="992" cy="147" rx="510" ry="310" fill="url(#glow)"/>
  <rect x="620" y="0" width="660" height="640" fill="url(#dots)" opacity=".48"/>
  <path d="M0 572 C250 530 440 625 690 580 S1080 510 1280 560" fill="none" stroke="#a3f56c" stroke-opacity=".11" stroke-width="2"/>

  <!-- Brand -->
  <rect x="72" y="72" width="54" height="54" rx="16" fill="#a3f56c"/>
  <text x="99" y="107" text-anchor="middle" fill="#101710" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">AI</text>
  <text x="144" y="96" fill="#a3b3c0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">AUTOMOTIVE INTELLIGENCE</text>
  <text x="144" y="121" fill="#f2f5f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">AutoNex AI</text>

  <text x="72" y="229" fill="#f4f7fa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-2.5">Compare cars</text>
  <text x="72" y="294" fill="#a3f56c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-2.5">with clarity.</text>
  <text x="74" y="354" fill="#aebdca" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Explore vehicle specs and get grounded,</text>
  <text x="74" y="386" fill="#aebdca" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">SLM-powered comparison insights.</text>

  <!-- Project highlights -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".5">
    <rect x="72" y="446" width="142" height="38" rx="19" fill="#17232d" stroke="#2a3b48"/>
    <circle cx="92" cy="465" r="4" fill="#a3f56c"/>
    <text x="105" y="470" fill="#dce5eb">CAR DATA</text>
    <rect x="226" y="446" width="132" height="38" rx="19" fill="#17232d" stroke="#2a3b48"/>
    <circle cx="246" cy="465" r="4" fill="#70c9ff"/>
    <text x="259" y="470" fill="#dce5eb">COMPARISONS</text>
    <rect x="370" y="446" width="116" height="38" rx="19" fill="#17232d" stroke="#2a3b48"/>
    <circle cx="390" cy="465" r="4" fill="#a3f56c"/>
    <text x="403" y="470" fill="#dce5eb">LOCAL SLM</text>
  </g>
  <text x="74" y="565" fill="#667988" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.1">AUTONEX-AI  ·  DEEP LEARNING PROJECT</text>

  <!-- Comparison panel -->
  <g filter="url(#shadow)">
    <rect x="624" y="62" width="592" height="516" rx="27" fill="#101821" stroke="#2a3945" stroke-width="1.5"/>
  </g>
  <text x="660" y="105" fill="#eef3f6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Vehicle comparison</text>
  <text x="660" y="128" fill="#8496a5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">See the facts side by side</text>
  <rect x="1135" y="84" width="44" height="28" rx="14" fill="#1b2c35"/>
  <circle cx="1149" cy="98" r="4" fill="#a3f56c"/>
  <text x="1159" y="102" fill="#c9d6de" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">AI</text>

  <!-- Vehicle cards -->
  <rect x="654" y="150" width="253" height="222" rx="18" fill="#151f29" stroke="#2c3d49"/>
  <rect x="933" y="150" width="253" height="222" rx="18" fill="#151f29" stroke="#2c3d49"/>
  <text x="674" y="178" fill="#8194a3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">VEHICLE 01</text>
  <text x="953" y="178" fill="#8194a3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">VEHICLE 02</text>

  <!-- Simple SUV illustrations -->
  <path d="M690 254 L702 233 Q707 226 718 224 L740 203 Q746 198 756 198 L799 198 Q808 198 814 205 L833 225 L852 230 Q860 233 863 242 L867 260 L858 267 L846 267 Q844 253 830 253 Q816 253 814 267 L741 267 Q739 253 725 253 Q711 253 709 267 L697 267 Q689 265 690 254Z" fill="url(#carPaint)"/>
  <path d="M746 207 L759 207 L759 224 L727 224 L742 210 Q744 208 746 207Z" fill="#152632"/>
  <path d="M767 207 L797 207 Q802 207 806 212 L817 224 L767 224Z" fill="#152632"/>
  <path d="M697 245 L859 245" stroke="#e1ffcc" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="725" cy="267" r="10" fill="#0c1117" stroke="#7d8b95" stroke-width="3"/>
  <circle cx="830" cy="267" r="10" fill="#0c1117" stroke="#7d8b95" stroke-width="3"/>

  <path d="M969 254 L981 233 Q986 226 997 224 L1019 203 Q1025 198 1035 198 L1078 198 Q1087 198 1093 205 L1112 225 L1131 230 Q1139 233 1142 242 L1146 260 L1137 267 L1125 267 Q1123 253 1109 253 Q1095 253 1093 267 L1020 267 Q1018 253 1004 253 Q990 253 988 267 L976 267 Q968 265 969 254Z" fill="url(#bluePaint)"/>
  <path d="M1025 207 L1038 207 L1038 224 L1006 224 L1021 210 Q1023 208 1025 207Z" fill="#152632"/>
  <path d="M1046 207 L1076 207 Q1081 207 1085 212 L1096 224 L1046 224Z" fill="#152632"/>
  <path d="M976 245 L1138 245" stroke="#d6f0ff" stroke-opacity=".42" stroke-width="2"/>
  <circle cx="1004" cy="267" r="10" fill="#0c1117" stroke="#7d8b95" stroke-width="3"/>
  <circle cx="1109" cy="267" r="10" fill="#0c1117" stroke="#7d8b95" stroke-width="3"/>

  <circle cx="920" cy="250" r="19" fill="#0c131a" stroke="#344753" stroke-width="1.5"/>
  <text x="920" y="254" text-anchor="middle" fill="#c0cdd6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">VS</text>

  <text x="674" y="306" fill="#f1f5f7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Mahindra Thar Roxx</text>
  <text x="953" y="306" fill="#f1f5f7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Hyundai Creta</text>
  <rect x="674" y="322" width="78" height="27" rx="13.5" fill="#1d3025"/>
  <text x="713" y="340" text-anchor="middle" fill="#b8f895" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">160 BHP</text>
  <rect x="953" y="322" width="78" height="27" rx="13.5" fill="#1b2d39"/>
  <text x="992" y="340" text-anchor="middle" fill="#a8ddff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">158 BHP</text>
  <text x="763" y="340" fill="#8093a1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">SUV · 5 seats</text>
  <text x="1042" y="340" fill="#8093a1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">SUV · 5 seats</text>

  <!-- AI analysis card -->
  <rect x="654" y="392" width="532" height="148" rx="18" fill="#141f27" stroke="#2c3d49"/>
  <rect x="677" y="415" width="40" height="40" rx="13" fill="#a3f56c"/>
  <text x="697" y="441" text-anchor="middle" fill="#101710" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">AI</text>
  <text x="735" y="429" fill="#ecf2f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">AutoNex AI Analysis</text>
  <text x="735" y="451" fill="#8fa2b0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">Dataset-backed comparison</text>
  <path d="M678 472 H1161" stroke="#2a3945"/>
  <text x="678" y="502" fill="#c5d1d9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Compare the details that matter for your drive.</text>
  <text x="678" y="524" fill="#8b9daa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">POWER  ·  ECONOMY  ·  FAMILY FIT</text>
  <circle cx="1155" cy="510" r="15" fill="#1d3025"/>
  <path d="M1149 510 H1161 M1156 505 L1161 510 L1156 515" fill="none" stroke="#a3f56c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
